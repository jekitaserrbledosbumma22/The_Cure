<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Lyrics v1</title>
<style>
  html,body{margin:0;height:100%;background:#040406;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  #hint{position:fixed;bottom:22px;left:0;right:0;text-align:center;color:#666;font:13px system-ui,sans-serif}
  #hint[hidden]{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<audio id="a" src="lagu.mp3" preload="auto" loop></audio>
<div id="hint" hidden>klik untuk mulai</div>
<script src="lirik.js"></script>
<script>

const MAJUKAN = 0.1;


const JADWAL = [
  {s: 2.0,  e: 4.5},
  {s: 5.3,  e: 8.0},
  {s: 8.9,  e: 11.0},
  {s: 11.9, e: 14.7},
  {s: 20.3, e: 21.7},
  {s: 26.2, e: 30.0},
  {s: 30.8, e: 33.4},
  {s: 33.9, e: 36.7},
  {s: 37.6, e: 40.0},
  {s: 40.8, e: 43.4},
  {s: 43.9, e: 46.1},
  {s: 46.9, e: 51.0},
  {s: 51.9, e: 54.4},
  {s: 54.9, e: 55.6, style: 'comment'}
];

// Waktu kemunculan suara di lagu (dihitung dari audio). Awal tiap baris ditempelkan ke suara terdekat (maks. 0.25 detik).
const ONSETS = [0.12, 0.3, 0.52, 0.71, 0.96, 1.14, 1.32, 1.55, 1.97, 2.21, 2.39, 2.6, 2.74, 3.02, 3.42, 3.58, 3.83, 4.04, 4.26, 4.46, 4.89, 5.28, 5.5, 5.7, 5.92, 6.1, 6.38, 6.54, 6.76, 7.01, 7.16, 7.38, 7.56, 7.81, 7.98, 8.3, 8.45, 8.64, 8.86, 9.05, 9.27, 9.48, 9.66, 9.89, 10.07, 10.36, 10.72, 10.98, 11.13, 11.33, 11.54, 11.67, 11.97, 12.15, 12.38, 12.67, 13.0, 13.22, 13.41, 13.83, 14.02, 14.26, 14.46, 14.59, 14.83, 15.09, 15.34, 15.73, 15.94, 16.12, 16.55, 16.7, 16.84, 17.09, 17.39, 17.62, 17.8, 17.94, 18.23, 18.41, 18.62, 18.85, 19.05, 19.32, 19.46, 19.7, 19.9, 20.06, 20.22, 20.5, 20.7, 20.9, 21.13, 21.35, 21.57, 21.78, 21.97, 22.22, 22.37, 22.61, 22.79, 23.03, 23.22, 23.65, 23.78, 23.92, 24.26, 24.46, 24.7, 24.9, 25.1, 25.31, 25.5, 25.7, 25.93, 26.12, 26.41, 26.54, 26.78, 26.98, 27.16, 27.38, 27.62, 27.79, 28.04, 28.31, 28.44, 28.62, 28.84, 29.02, 29.28, 29.47, 29.66, 29.87, 30.1, 30.34, 30.46, 30.72, 30.93, 31.11, 31.37, 31.56, 31.76, 31.95, 32.17, 32.38, 32.6, 32.78, 33.22, 33.46, 33.86, 34.05, 34.26, 34.47, 34.67, 34.89, 35.11, 35.44, 35.72, 35.94, 36.15, 36.37, 36.61, 36.8, 36.97, 37.19, 37.4, 37.7, 37.85, 38.04, 38.25, 38.5, 38.64, 38.89, 39.07, 39.26, 39.68, 39.86, 40.03, 40.17, 40.34, 40.5, 40.74, 40.9, 41.12, 41.42, 41.6, 41.96, 42.15, 42.41, 42.61, 42.78, 43.02, 43.23, 43.46, 43.64, 43.86, 44.05, 44.28, 44.47, 44.7, 44.92, 45.11, 45.3, 45.5, 45.72, 45.94, 46.12, 46.37, 46.55, 46.78, 47.05, 47.18, 47.42, 47.58, 47.86, 47.99, 48.23, 48.54, 48.67, 48.86, 49.06, 49.29, 49.46, 49.73, 49.9, 50.08, 50.31, 50.52, 50.72, 50.94, 51.14, 51.29, 51.56, 51.78, 51.97, 52.15, 52.38, 52.58, 52.89, 53.22, 53.44, 53.62, 53.82, 54.08, 54.28, 54.48, 54.86, 55.3, 55.54, 55.71, 55.94, 56.13, 56.38];
function snap(t){ let best = t, d = 0.25 + 1e-9; for (const o of ONSETS){ const dd = Math.abs(o - t); if (dd < d){ d = dd; best = o; } } return best; }

// ===== LIRIK -> BARIS KODE (otomatis, dari teks di lirik.js) =====
function words(text){
  return text.replace(/\(.*?\)/g, ' ').toLowerCase().replace(/[‘’']/g, '').replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(Boolean);
}
function toCode(text, style){
  const w = words(text), n = w.length;
  if (!n) return '';
  if (style === 'comment') return '// ' + w.slice(-2).map(x => x[0].toUpperCase() + x.slice(1)).join(' ');
  if (n === 1) return '{ "' + w[0] + '" };';
  if (n <= 3) return '{ ' + w.slice(0, n-1).join('_') + ': "' + w[n-1] + '" };';
  const head = n >= 6 ? w[0] + '.' + w[1] : w[0], rest = n >= 6 ? w.slice(2) : w.slice(1);
  const k = Math.max(1, Math.ceil((rest.length - 1) / 2));
  const arg = rest.slice(0, k).join('_'), key = rest[k] || 'value', val = rest.slice(k + 1).join('_') || rest[k] || arg;
  return head + '( "' + arg + '" ){ ' + key + ': "' + val + '" };';
}
const texts = (typeof LIRIK === 'string' ? LIRIK : '').split('\n').map(l => l.trim()).filter(Boolean);
const PUNCT = '(){};,.:';
function colorize(code){
  if (code.startsWith('//')) return Array.from(code, () => 'c');
  const cls = []; let inStr = false;
  for (let i = 0; i < code.length; i++){
    const ch = code[i];
    if (ch === '"'){ cls.push('s'); inStr = !inStr; continue; }
    if (inStr){ cls.push('s'); continue; }
    if (PUNCT.includes(ch)){ cls.push('p'); continue; }
    cls.push('i');
  }
  // kata sebelum ':' di luar tanda kutip = kunci (biru)
  for (let i = 0; i < code.length; i++){
    if (code[i] === ':' && cls[i] === 'p'){
      let j = i - 1; while (j >= 0 && /[a-z0-9_]/.test(code[j]) && cls[j] === 'i'){ cls[j] = 'k'; j--; }
    }
  }
  return cls;
}
const lines = [];
texts.forEach((t, i) => {
  const j = JADWAL[i]; if (!j) return;
  const code = toCode(t, j.style); if (!code) return;
  lines.push({num: i + 1, code, cls: colorize(code), s: snap(j.s), e: j.e});
});

// ===== TAMPILAN =====
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), a = document.getElementById('a');
let W = 0, H = 0, DPR = 1;
function resize(){ DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize', resize); resize();

const COL = {i:'#ffffff', k:'#79c0ff', p:'#ff4d4d', s:'#f4ead8', c:'#9be3a8'};
const GLITCH = '#%&@$?/<>=+*[]';
const ease = x => 1 - Math.pow(1 - x, 3);

function draw(){
  const T = a.currentTime + MAJUKAN;
  ctx.fillStyle = '#040406'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W/2, H*0.5, 0, W/2, H*0.5, Math.max(W,H)*0.7);
  g.addColorStop(0, 'rgba(60,10,20,0.18)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  const fontPx = Math.max(14, Math.min(H * 0.07, W * 0.04)), lineH = fontPx * 2.0, baseY = H * 0.5;
  ctx.textBaseline = 'middle';
  ctx.font = `600 ${fontPx}px "JetBrains Mono","Fira Code",Consolas,"Courier New",monospace`;
  const cw = ctx.measureText('M').width, margin = W * 0.09, maxVis = W * 0.86;

  let act = -1; for (let i = 0; i < lines.length; i++) if (T >= lines[i].s) act = i;
  if (act < 0){ // sebelum baris pertama: kursor berkedip
    if (Math.floor(T * 2) % 2 === 0){ ctx.fillStyle = '#ff3b3b'; ctx.fillRect(margin, baseY - fontPx*0.55, cw*0.6, fontPx*1.1); }
    return;
  }
  const since = T - lines[act].s, pos = act > 0 ? (act - 1) + ease(Math.min(1, since / 0.35)) : act;

  for (let i = 0; i <= act; i++){
    const L = lines[i], d = pos - i, y = baseY - d * lineH;
    if (y < -lineH || y > H + lineH) continue;
    const isAct = i === act;
    let n = L.code.length, typing = false;
    if (isAct){ const p = Math.max(0, Math.min(1, (T - L.s) / Math.max(0.2, L.e - L.s))); n = Math.floor(p * L.code.length + (p > 0 ? 1 : 0)); n = Math.min(n, L.code.length); typing = p < 1; }
    const alpha = d <= 0.02 ? 1 : Math.max(0.06, 0.55 / (1 + (d - 1) * 1.1)) * Math.min(1, 1.2 - d*0.05);
    const shift = Math.max(0, (n + 2) * cw - maxVis), x0 = margin - shift;
    ctx.globalAlpha = alpha;
    // nomor baris
    ctx.fillStyle = '#555'; ctx.font = `500 ${fontPx*0.5}px "JetBrains Mono",Consolas,monospace`; ctx.fillText(String(L.num), Math.max(4, margin - cw*3), y + fontPx*0.55);
    ctx.font = `${L.cls[0] === 'c' ? 'italic ' : ''}600 ${fontPx}px "JetBrains Mono","Fira Code",Consolas,"Courier New",monospace`;
    for (let k = 0; k < n; k++){
      let ch = L.code[k];
      if (typing && k >= n - 1 && Math.random() < 0.5) ch = GLITCH[Math.floor(Math.random() * GLITCH.length)];
      const x = x0 + k * cw; if (x < -cw || x > W) continue;
      ctx.fillStyle = COL[L.cls[k]] || '#fff';
      if (!isAct && L.cls[k] !== 'c') ctx.globalAlpha = alpha * 0.9;
      ctx.fillText(ch, x, y);
    }
    if (isAct){ // kursor merah
      const on = typing || Math.floor(T * 2) % 2 === 0;
      if (on){ ctx.globalAlpha = 1; ctx.shadowColor = '#ff2a2a'; ctx.shadowBlur = fontPx * 0.6; ctx.fillStyle = '#ff3b3b';
        ctx.fillRect(x0 + n * cw + cw*0.1, y - fontPx*0.55, cw*0.6, fontPx*1.1); ctx.shadowBlur = 0; }
    }
    ctx.globalAlpha = 1;
  }
}
function loop(){ draw(); requestAnimationFrame(loop); }
loop();

// mulai otomatis; jika diblokir browser, klik/ketuk/tombol pertama memulai
const hint = document.getElementById('hint'), events = ['pointerdown','keydown','touchstart'];
function go(){ a.play().then(() => { hint.hidden = true; events.forEach(t => removeEventListener(t, go)); }).catch(()=>{}); }
a.currentTime = 0;
a.play().catch(() => { hint.hidden = false; events.forEach(t => addEventListener(t, go)); });
</script>
</body>
</html>
